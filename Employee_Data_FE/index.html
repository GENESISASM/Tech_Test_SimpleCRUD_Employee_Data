<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Data Karyawan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h3 class="mb-4">Aplikasi Data Pribadi (Karyawan)</h3>

    <!-- SECTION 1: MONITORING (TABEL) -->
    <div id="monitoring-section" class="card p-4">
        <div class="d-flex justify-content-between mb-3">
            <div class="input-group w-50">
                <input type="text" id="searchInput" class="form-control" placeholder="Cari NIK atau Nama...">
                <button class="btn btn-primary" onclick="searchData()">Search</button>
            </div>
            <button class="btn btn-primary" onclick="showAddForm()">+ Add Data</button>
        </div>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIK</th>
                    <th>Nama Lengkap</th>
                    <th>Umur</th>
                    <th>Tanggal Lahir</th>
                    <th>Jenis Kelamin</th>
                    <th>Alamat</th>
                    <th>Negara</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Data dari database akan masuk ke sini via JQuery -->
            </tbody>
        </table>
    </div>

    <!-- SECTION 2: FORM TAMBAH / EDIT -->
    <div id="form-section" class="card p-4 w-75 mx-auto">
        <h5 id="form-title" class="mb-4">Tambah Data Baru</h5>
        <form id="employeeForm">
            <!-- Hidden input penanda Edit/Add. Berisi ID/NIK asli -->
            <input type="hidden" id="originalId">

            <div class="mb-3">
                <label class="form-label">NIK</label>
                <input type="number" id="nik" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Jenis Kelamin</label><br>
                <input type="radio" name="gender" value="Laki-laki" id="genderL" required> Laki-laki
                <input type="radio" name="gender" value="Perempuan" id="genderP" class="ms-3"> Perempuan
            </div>
            <div class="mb-3">
                <label class="form-label">Tanggal Lahir</label>
                <input type="date" id="dob" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Alamat</label>
                <textarea id="address" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Negara</label>
                <select id="nationality" class="form-select" required>
                    <option value="">Pilih Negara</option>
                    <option value="Indonesia">Indonesia</option>
                    <option value="Malaysia">Malaysia</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Portugal">Portugal</option>
                    <option value="Rusia">Rusia</option>
                </select>
            </div>

            <div class="mt-4">
                <button type="button" id="btnSave" class="btn btn-primary px-4" onclick="saveData()">Simpan</button>
                <button type="button" class="btn btn-secondary px-4" onclick="showMonitoring()">Kembali</button>
            </div>
        </form>
    </div>
</div>

<!-- JQuery & Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="script.js"></script>
</body>
</html>
